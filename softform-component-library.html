men.wide,.specimen.full-span{grid-column:1}.specimen-stage{padding:28px;min-height:201px;border-radius:21px}.specimen-stage.tall{min-height:260px}.specimen-footer{padding-top:13px}.specimen-footer .title{font-size:12px}.specimen-footer .component-name{font-size:9px}.sf-stat .stat-value{font-size:44px}.sf-donut{gap:30px}.sf-workflow{gap:12px}.workflow-node .node-orb{width:59px;height:59px}.sf-workflow:before{top:29px}.workflow-node .node-card{padding:14px 10px;min-height:110px;border-radius:12px}.workflow-node .node-card strong{font-size:11px}.workflow-node .node-card p{font-size:9px;line-height:1.7}.dashboard-panel{padding:21px;border-radius:22px}.dashboard-head{flex-wrap:wrap;gap:15px;margin-bottom:23px}.dashboard-head h3{font-size:22px}.dashboard-grid{grid-template-columns:1fr}.dashboard-column:last-child{grid-column:auto;display:flex}.dashboard-column .sf-calendar{max-width:none}.dashboard-head .sf-badge{font-size:8px}.dashboard-bottom{font-size:8px;gap:10px}.assembly-controls{gap:9px;margin-top:12px;flex-wrap:wrap}.assembly-heading{display:block}.adapter-shell{padding:20px;border-radius:20px}.adapter-intro{gap:16px;margin-bottom:23px}.adapter-path{gap:6px;font-size:8px;flex-wrap:wrap}.adapter-grid{grid-template-columns:1fr;gap:25px}.adapter-editor{font-size:10px;min-height:265px;padding:17px}.adapter-status{font-size:8px}.adapter-actions{gap:8px}.adapter-actions .sf-button{font-size:9px;padding:6px 9px}.canonical-block .sf-button{font-size:9px}.quickstart{grid-template-columns:1fr;gap:23px;padding:20px 0 30px}.quickstart h3{font-size:26px}.quickstart .code-block{font-size:9px;padding:20px}.footer{font-size:9px;flex-direction:column;align-items:flex-start;gap:16px;padding:24px 0}.footer-links{width:100%;justify-content:space-between}.dialog-header{padding:21px}.dialog-body{padding:21px}.dialog-footer{padding:0 21px 23px}.code-block{padding:17px;font-size:10px}.sf-dialog{border-radius:20px}.sf-dialog.drawer{border-radius:20px 0 0 20px}.toast-host{right:20px;bottom <body>
<noscript><p style="padding:30px;font-family:sans-serif">This interactive Vue library needs JavaScript enabled. All code and assets are embedded in this file.</p></noscript>
<div id="app" v-cloak></div>
<script type="text/x-template" id="gallery-template">
<div>
  <a class="skip-link" href="#main-content">Skip to component library</a>
  <header class="topbar">
    <button type="button" class="bare-button mobile-menu" aria-label="Toggle component navigation" :aria-expanded="mobileOpen" aria-controls="library-sidebar" @click="mobileOpen=!mobileOpen"><sf-icon :name="mobileOpen?'close':'menu'"/></button>
    <a href="#overview" class="brand" @click.prevent="jump('overview')"><span class="brand-mark" aria-hidden="true"><i></i></span>softform<span class="sr-only"> component library</span></a>
    <div class="crumb">Design system <span style="margin:0 12px;color:#8a969c">/</span> <strong>Component library</strong></div>
    <label class="header-search"><sf-icon name="search" size="sm"/><input ref="searchEl" type="search" v-model="query" placeholder="Find a component..." aria-label="Find a component" autocomplete="off"/><kbd aria-hidden="true">/</kbd></label>
    <div class="top-actions"><button type="button" class="bare-button" :aria-label="theme==='light'?'Switch to dark canvas':'Switch to light canvas'" :title="theme==='light'?'Dark canvas':'Light canvas'" @click="theme=theme==='light'?'dark':'light'"><sf-icon :name="theme==='light'?'moon':'sun'" size="sm"/></button><sf-button variant="dark" icon="download" class="download-button" @click="exportTokens">Export tokens</sf-button></div>
  </header>
  <button v-if="mobileOpen" type="button" class="menu-backdrop open" aria-label="Close navigation" @click="mobileOpen=false"></button>
  <aside id="library-sidebar" class="sidebar" :class="{open:mobileOpen}">
    <div class="sidebar-label">THE LIBRARY</div>
    <nav class="sidebar-nav" aria-label="Component library sections">
      <a href="#overview" class="nav-link" :class="{active:activeSection==='overview'}" @click.prevent="jump('overview')"><sf-icon name="grid" size="sm"/>Overview<span class="nav-count">{{total}}</span></a>
      <a v-for="section in sections" :key="section.id" :href="'#'+section.id" class="nav-link" :class="{active:activeSection===section.id}" @click.prevent="jump(section.id)"><sf-icon :name="section.icon" size="sm"/>{{section.id==='compositions'?'Compositions':section.title}}<span class="nav-count">{{String(section.items.length).padStart(2,'0')}}</span></a>
    </nav>
    <hr class="sidebar-rule"/>
    <div class="sidebar-label">PUT IT TOGETHER</div>
    <nav class="sidebar-nav" aria-label="Library playgrounds">
      <a href="#in-context" class="nav-link" :class="{active:activeSection==='in-context'}" @click.prevent="jump('in-context')"><sf-icon name="monitor" size="sm"/>In context<sf-icon name="arrow" size="sm" style="margin-left:auto"/></a>
      <a href="#adapters" class="nav-link" :class="{active:activeSection==='adapters'}" @click.prevent="jump('adapters')"><sf-icon name="database" size="sm"/>Adapter lab<sf-badge tone="accent" style="margin-left:auto;font-size:7px;padding:1px 5px">LIVE</sf-badge></a>
    </nav>
    <div class="sidebar-bottom"><div class="sidebar-note"><sf-icon name="flow" size="sm"/><strong style="display:block;font-size:12px;margin-top:11px">Built to connect.</strong><p>Different data. One shared language. Zero redesign.</p><button type="button" @click="jump('adapters')">Meet the adapters <sf-icon name="arrow" size="sm"/></button></div><div class="build-note"><i class="status-dot"></i>Vue {{VueVersion}} · local & self-contained</div></div>
  </aside>
  <main id="main-content" class="main">
    <section id="overview" data-section>
      <div v-if="!query" class="hero">
        <div><div class="hero-kicker eyebrow">A TACTILE VUE COMPONENT SYSTEM <span class="tag">V 1.0</span></div><h1>A little depth.<br><span>A lot of possibility.</span></h1><p class="hero-description">Soft surfaces. Thoughtful details. A modular collection of components that feels as good as it works.</p><div class="hero-meta"><span>{{total}} components</span><span>3 data adapters</span><span>One design language</span></div></div>
        <div class="hero-display" aria-label="Interactive material preview"><div class="hero-display-head"><span>YOUR SPACE, IN BALANCE</span><span class="row" style="gap:5px"><i class="status-dot"></i> LIVE PREVIEW</span></div><div class="hero-tiles">
          <sf-surface class="hero-tile"><div class="title">Messages <sf-icon name="mail" size="sm"/></div><div class="big-value">128<span style="font-size:18px;letter-spacing:0;color:#7a888f"> ↗</span></div><div class="metric-foot"><span>+12.8%</span><span>this week</span></div><div class="mini-track"><span></span></div></sf-surface>
          <sf-surface class="hero-tile focus-tile"><div class="hero-orbit"><sf-icon-button icon="leaf" label="Toggle focus mode" :pressed="s.focus" :tone="s.focus?'dark':''" @click="s.focus=!s.focus"/></div><strong style="font-size:13px;font-weight:500;margin-top:7px">{{s.focus?'Find your focus.':'Room to wander.'}}</strong><span style="font-size:9px;color:#617079">A little less noise.</span></sf-surface>
          <sf-surface class="hero-control"><span class="mini-circle"><sf-icon name="spark" size="sm"/></span><div><strong>Focus mode</strong><p>{{s.focus?'Less distraction. More intention.':'Your whole world, switched on.'}}</p></div><sf-switch v-model="s.focus" label="Hero focus mode" :hide-label="true"/></sf-surface>
        </div></div>
      </div>
      <div class="library-toolbar"><button type="button" class="library-tab active" @click="jump('foundations')">All components <small>{{query?matchCount:total}}</small></button><button type="button" class="library-tab" @click="jump('in-context')">In context</button><button type="button" class="library-tab" @click="jump('adapters')">Adapter lab <small>03</small></button><div class="toolbar-right"><span>{{query ? matchCount+' matches' : 'Designed to be touched.'}}</span><button type="button" :aria-pressed="contrast" @click="contrast=!contrast" title="Toggle a flat, high-contrast material"><sf-icon name="eye" size="sm"/> {{contrast?'Flat contrast':'Soft depth'}}</button></div></div>
    </section>
    <div v-if="query && matchCount===0" class="no-results"><sf-empty-state title="Nothing by that name, yet." :message="'No components match “'+query+'”. Try slider, card, or navigation.'" action="Clear search" @action="query=''"/></div>
    <p v-if="query && matchCount" class="section-note" role="status">{{matchCount}} component{{matchCount===1?'':'s'}} matching “{{query}}”.</p>

    <section id="foundations" data-section class="library-section" v-if="sectionVisible('foundations')">
      <div class="section-head"><div><div class="section-kicker"><span class="section-index">01</span><h2>Foundations</h2></div><p>Quiet materials. A consistent visual language.</p></div><span class="section-count">06 components</span></div>
      <div class="specimen-grid">
        <specimen name="SfSurface" v-if="visible('SfSurface')" @inspect="inspect"><sf-surface class="material-demo"><div class="row between"><sf-icon name="layers" size="sm"/><span class="micro-label">01 / CERAMIC</span></div><h3>A softer surface.</h3><p>Light above. A little depth below.</p></sf-surface></specimen>
        <specimen name="SfIcon" v-if="visible('SfIcon')" @inspect="inspect"><div class="icon-grid"><span v-for="icon in iconNames" :key="icon" :title="icon"><sf-icon :name="icon"/></span></div></specimen>
        <specimen name="SfBadge" v-if="visible('SfBadge')" @inspect="inspect"><div class="demo-wrap"><div class="demo-center"><sf-badge tone="accent" :dot="true">Live</sf-badge><sf-badge tone="dark">12 new</sf-badge><sf-badge tone="outline">Beta</sf-badge></div><div class="demo-center"><sf-badge :dot="true">In progress</sf-badge><sf-badge tone="outline">Draft</sf-badge><sf-badge tone="accent">PRO</sf-badge></div><div class="center micro-label">Small signals. Clear meaning.</div></div></specimen>
        <specimen name="SfAvatar" v-if="visible('SfAvatar')" @inspect="inspect"><div class="demo-wrap"><div class="demo-center"><sf-avatar initials="AM" label="Brad Morgan" size="large" tone="dark"/><sf-avatar initials="MC" label="Maya Chen" size="large"/><sf-avatar icon="user" label="Guest profile" size="large" tone="accent"/></div><div class="demo-center" style="gap:14px"><div class="avatar-stack"><sf-avatar initials="AM" label="Brad Morgan" tone="dark"/><sf-avatar initials="MC" label="Maya Chen"/><sf-avatar initials="JL" label="Jamie Lee" tone="accent"/><sf-avatar initials="+4" label="Four more people"/></div><span class="micro-label">Better together.</span></div></div></specimen>
        <specimen name="SfDivider" v-if="visible('SfDivider')" @inspect="inspect"><div class="demo-wrap"><sf-divider/><sf-divider>or continue with</sf-divider><div class="row between"><span class="micro-label">Nothing extra.</span><sf-icon name="spark" size="sm"/><span class="micro-label">Just enough.</span></div><sf-divider/></div></specimen>
        <specimen name="SfSkeleton" v-if="visible('SfSkeleton')" @inspect="inspect"><sf-skeleton/></specimen>
      </div>
    </section>

    <section id="actions" data-section class="library-section" v-if="sectionVisible('actions')">
      <div class="section-head"><div><div class="section-kicker"><span class="section-index">02</span><h2>Actions</h2></div><p>Made to feel like a natural next step.</p></div><span class="section-count">04 components</span></div>
      <div class="specimen-grid">
        <specimen name="SfButton" v-if="visible('SfButton')" :wide="true" @inspect="inspect"><div class="demo-wrap"><div class="demo-center"><sf-button variant="dark" icon="plus" @click="s.demoModal=true">Create workspace</sf-button><sf-button variant="accent" icon="arrow" @click="jump('adapters')">Get started</sf-button><sf-button icon="download" @click="exportTokens">Export tokens</sf-button></div><div class="demo-center"><sf-button variant="ghost" @click="notify('Secondary action selected.')">Secondary</sf-button><sf-button :loading="s.saving" @click="save">{{s.saving?'Working...':'Try loading'}}</sf-button><sf-button :disabled="true">Disabled</sf-button></div></div></specimen>
        <specimen name="SfIconButton" v-if="visible('SfIconButton')" @inspect="inspect"><div class="demo-wrap"><div class="demo-center"><sf-icon-button icon="plus" label="Create a workspace" size="large" @click="s.demoModal=true"/><sf-icon-button icon="heart" :label="s.favorite?'Remove from favorites':'Add to favorites'" :tone="s.favorite?'accent':'dark'" size="large" :pressed="s.favorite" @click="s.favorite=!s.favorite"/><sf-icon-button icon="arrow" label="Explore adapter playground" tone="accent" size="large" @click="jump('adapters')"/></div><div class="center micro-label">Raised. Pressed. Reassuring.</div></div></specimen>
        <specimen name="SfButtonGroup" v-if="visible('SfButtonGroup')" @inspect="inspect"><div class="demo-wrap"><div class="center"><sf-button-group v-model="s.alignment" label="Text alignment" :options="[{value:'left',label:'Align left',icon:'alignLeft'},{value:'center',label:'Align center',icon:'alignCenter'},{value:'right',label:'Align right',icon:'alignRight'}]"/></div><p class="micro-label full" :style="{textAlign:s.alignment}">A little alignment goes a long way.</p></div></specimen>
        <specimen name="SfFab" v-if="visible('SfFab')" :wide="true" @inspect="inspect"><div class="demo-center" style="gap:30px"><sf-fab label="Something new" @click="s.demoModal=true"/><span class="micro-label">Good things start with a little +</span></div></specimen>
      </div>
    </section>

    <section id="inputs" data-section class="library-section" v-if="sectionVisible('inputs')">
      <div class="section-head"><div><div class="section-kicker"><span class="section-index">03</span><h2>Inputs & controls</h2></div><p>A satisfying way to set things just right.</p></div><span class="section-count">11 components</span></div>
      <div class="specimen-grid">
        <specimen name="SfInput" v-if="visible('SfInput')" :tall="true" @inspect="inspect"><div class="demo-wrap"><sf-input v-model="s.name" label="Your name" icon="user"/><sf-input v-model="s.email" label="Email address" type="email" icon="mail" placeholder="you@studio.co" :error="s.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email)?'A complete email address, please.':''"/></div></specimen>
        <specimen name="SfTextarea" v-if="visible('SfTextarea')" :tall="true" @inspect="inspect"><sf-textarea v-model="s.notes" label="Workspace notes" placeholder="A good idea starts here..."/></specimen>
        <specimen name="SfSelect" v-if="visible('SfSelect')" :tall="true" @inspect="inspect"><div class="demo-wrap"><sf-select v-model="s.workspace" label="Switch workspace" :options="[{value:'personal',label:'Personal workspace'},{value:'studio',label:'Design studio'},{value:'team',label:'Product team'}]"/><div class="row hint"><sf-icon name="lock" size="sm"/><span>{{s.workspace==='personal'?'Only you can access this space.':'A shared space for your team.'}}</span></div></div></specimen>
        <specimen name="SfCheckbox" v-if="visible('SfCheckbox')" @inspect="inspect"><div class="component-group"><sf-checkbox v-model="s.checkOne" label="Email notifications"/><sf-checkbox v-model="s.checkTwo" label="Weekly inspiration"/><sf-checkbox :model-value="false" :disabled="true" label="Managed by your workspace"/></div></specimen>
        <specimen name="SfRadioGroup" v-if="visible('SfRadioGroup')" @inspect="inspect"><sf-radio-group v-model="s.plan" label="Make yourself at home" :options="[{value:'solo',label:'Solo'},{value:'studio',label:'Studio'},{value:'team',label:'Team'}]"/></specimen>
        <specimen name="SfSwitch" v-if="visible('SfSwitch')" @inspect="inspect"><div class="component-group"><div class="row between"><span class="small">Focus mode</span><sf-switch v-model="s.focus" label="Control focus mode" :hide-label="true"/></div><sf-divider/><div class="row between"><span class="small">Notifications</span><sf-switch v-model="s.notifications" label="Notifications" :hide-label="true"/></div><div class="row between"><span class="small muted">Airplane mode</span><sf-switch v-model="s.airplane" label="Airplane mode" :hide-label="true"/></div></div></specimen>
        <specimen name="SfSlider" v-if="visible('SfSlider')" @inspect="inspect"><div class="demo-wrap"><sf-slider v-model="s.level" label="Brightness" :ticks="false"/><sf-slider v-model="s.volume" label="Ambient volume" :ticks="false"/></div></specimen>
        <specimen name="SfStepper" v-if="visible('SfStepper')" @inspect="inspect"><div class="demo-wrap"><div class="center"><sf-stepper v-model="s.quantity" label="Guests" :min="1" :max="12"/></div><div class="center micro-label">{{s.quantity}} guests. Room for good company.</div></div></specimen>
        <specimen name="SfDial" v-if="visible('SfDial')" @inspect="inspect"><sf-dial v-model="s.level" label="Light intensity"/></specimen>
        <specimen name="SfRating" v-if="visible('SfRating')" @inspect="inspect"><div class="demo-wrap"><div class="center"><sf-rating v-model="s.rating" label="Library rating"/></div><div class="center micro-label">{{s.rating}} / 5 · {{s.rating>=4?'Feels pretty good.':'Room to keep refining.'}}</div></div></specimen>
        <specimen name="SfFileUpload" v-if="visible('SfFileUpload')" :wide="true" @inspect="inspect"><sf-file-upload @select="file => file && notify('Selected '+file.name+'. No data was uploaded.')"/></specimen>
      </div>
    </section>

    <section id="navigation" data-section class="library-section" v-if="sectionVisible('navigation')">
      <div class="section-head"><div><div class="section-kicker"><span class="section-index">04</span><h2>Navigation</h2></div><p>A little guidance. No unnecessary friction.</p></div><span class="section-count">07 components</span></div>
      <div class="specimen-grid">
        <specimen name="SfTabs" v-if="visible('SfTabs')" @inspect="inspect"><sf-tabs v-model="s.tab" label="Workspace tabs" :options="[{value:'overview',label:'Overview'},{value:'activity',label:'Activity'},{value:'settings',label:'Settings'}]"><p v-if="s.tab==='overview'">Everything you need, right where you expect it. Welcome to your workspace.</p><p v-else-if="s.tab==='activity'">12 messages, 3 updates, and a little time to catch your breath.</p><p v-else>Make this space your own. Your preferences belong here.</p></sf-tabs></specimen>
        <specimen name="SfSegmented" v-if="visible('SfSegmented')" @inspect="inspect"><div class="demo-wrap"><div class="center"><sf-segmented v-model="s.segment" label="Activity period" :options="[{value:'day',label:'Day'},{value:'week',label:'Week'},{value:'month',label:'Month'}]"/></div><div class="center micro-label">{{s.segment==='day'?'A fresh perspective, today.':s.segment==='week'?'Your week, at a glance.':'The bigger picture, in focus.'}}</div></div></specimen>
        <specimen name="SfBreadcrumbs" v-if="visible('SfBreadcrumbs')" @inspect="inspect"><sf-breadcrumbs :items="['Library','Controls','Dial']" @navigate="item => jump(item==='Library'?'foundations':'inputs')"/></specimen>
        <specimen name="SfPagination" v-if="visible('SfPagination')" @inspect="inspect"><div class="demo-wrap"><sf-pagination v-model="s.page" :pages="4"/><div class="center micro-label">Showing {{(s.page-1)*12+1}}–{{s.page*12}} of 48 items</div></div></specimen>

C('SfTable',{props:{columns:{type:Array,default:()=>[]},rows:{type:Array,default:()=>[]},caption:{type:String,default:'Recent activity'}},setup(p){const sort=ref(''),asc=ref(true);const sorted=computed(()=>{if(!sort.value)return p.rows;return [...p.rows].sort((a,b)=>{const av=a[sort.value],bv=b[sort.value];return(typeof av==='number'&&typeof bv==='number'?av-bv:String(av??'').localeCompare(String(bv??'')))*(asc.value?1:-1)})});function sortBy(k){if(sort.value===k)asc.value=!asc.value;else{sort.value=k;asc.value=true}}return{sort,asc,sorted,sortBy}},template:`<div class="sf-surface table-shell"><table class="sf-table"><caption>{{caption}}</caption><thead><tr><th v-for="c in columns" :key="c.key" scope="col" :aria-sort="sort===c.key?(asc?'ascending':'descending'):'none'"><button type="button" @click="sortBy(c.key)">{{c.label}}<sf-icon :name="sort===c.key?(asc?'up':'down'):'sort'"/></button></th></tr></thead><tbody><tr v-for="(r,i) in sorted" :key="r.id || i"><td v-for="c in columns" :key="c.key"><sf-badge v-if="c.badge" :tone="r[c.key]==='Active'?'accent':'outline'">{{r[c.key]}}</sf-badge><template v-else>{{r[c.key]}}</template></td></tr><tr v-if="!rows.length"><td :colspan="columns.length">No records yet.</td></tr></tbody></table></div>`});

C('SfCalendar',{props:{modelValue:{type:String,default:'2026-09-23'}},emits:['update:modelValue'],setup(p,{emit}){const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y||2026,(m||9)-1,d||1)};const cursor=ref(parse(p.modelValue)),root=ref(null);const title=computed(()=>cursor.value.toLocaleDateString('en-US',{month:'long',year:'numeric'}));const days=computed(()=>{const y=cursor.value.getFullYear(),m=cursor.value.getMonth();const offset=(new Date(y,m,1).getDay()+6)%7;return [...Array(offset).fill(null),...Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>i+1)]});const iso=d=>`${cursor.value.getFullYear()}-${String(cursor.value.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;function month(n){cursor.value=new Date(cursor.value.getFullYear(),cursor.value.getMonth()+n,1)}function key(e,d){const delta={ArrowRight:1,ArrowLeft:-1,ArrowDown:7,ArrowUp:-7}[e.key];if(delta===undefined)return;e.preventDefault();const date=new Date(cursor.value.getFullYear(),cursor.value.getMonth(),d+delta);cursor.value=date;nextTick(()=>root.value.querySelector(`[data-day="${date.getDate()}"]`)?.focus())}watch(()=>p.modelValue,v=>{cursor.value=parse(v)});return{root,title,days,iso,month,key,week:['M','T','W','T','F','S','S']}},template:`<div ref="root" class="sf-surface sf-calendar"><div class="calendar-head"><button type="button" aria-label="Previous month" @click="month(-1)"><sf-icon name="left"/></button><span aria-live="polite">{{title}}</span><button type="button" aria-label="Next month" @click="month(1)"><sf-icon name="chevron"/></button></div><div class="calendar-grid"><span class="weekday" v-for="(w,i) in week" :key="'w'+i" aria-hidden="true">{{w}}</span><template v-for="(d,i) in days" :key="'d'+i"><button v-if="d" type="button" :data-day="d" :aria-label="title+' '+d" :aria-pressed="modelValue===iso(d)" @click="$emit('update:modelValue',iso(d))" @keydown="key($event,d)">{{d}}</button><span v-else aria-hidden="true"></span></template></div><div class="calendar-foot">Selected · {{modelValue}}</div></div>`});

class NotificationAdapter { adapt(_payload){throw new Error('Implement adapt(payload) in a concrete adapter.')} }
class RestNotificationAdapter extends NotificationAdapter {

    return payload.notifications.map(n=>({id:n.notification_id,type:n.category,title:n.subject,body:n.preview,sender:n.sender?.display_name,time:n.received_at,count:n.unread_count}));

}
class GraphQLNotificationAdapter extends NotificationAdapter {
  adapt(payload){

    if(!Array.isArray(edges))throw new Error('GraphQL adapter expects data.inbox.edges.');
    return edges.map(e=>{if(!e?.node)throw new Error('Each GraphQL edge must contain a node.');const n=e.node;return{id:n.key,type:String(n.kind).toLowerCase(),title:n.headline,body:n.content,sender:n.author?.name,time:n.displayTime,count:n.unreadCount};});
  }

class LegacyNotificationAdapter extends NotificationAdapter {

function validateCards(cards){

  const ids=new Set();

    if(!c || typeof c!=='object')throw new Error(`Card ${i+1} is not an object.`);
    for(const key of ['id','type','title','body','sender','time'])if(typeof c[key]!=='string'||!c[key].trim())throw new Error(`Card ${i+1}: ${key} must be a non-empty string.`);
    if(!['message','call','status'].includes(c.type))throw new Error(`Card ${i+1}: type must be message, call, or status.`);
    if(!Number.isInteger(c.count)||c.count<0)throw new Error(`Card ${i+1}: count must be a non-negative integer.`);
    if(ids.has(c.id))throw new Error(`Duplicate card id: ${c.id}`);
    ids.add(c.id);
